name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -o dist/products-api-linux-amd64   ./cmd/server
          GOOS=linux   GOARCH=arm64 go build -o dist/products-api-linux-arm64   ./cmd/server
          GOOS=darwin  GOARCH=amd64 go build -o dist/products-api-darwin-amd64  ./cmd/server
          GOOS=darwin  GOARCH=arm64 go build -o dist/products-api-darwin-arm64  ./cmd/server
          GOOS=windows GOARCH=amd64 go build -o dist/products-api-windows-amd64.exe ./cmd/server

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
